<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C18" />
      <stop offset="50%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#151D30" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB52E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFB52E" stop-opacity="0" />
    </radialGradient>

    <!-- Sun Core Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="45%" stop-color="#FFB52E" />
      <stop offset="100%" stop-color="#E58A00" />
    </linearGradient>

    <!-- Moon Glow Gradient -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4D9DFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4D9DFF" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Core Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2E0FF" />
      <stop offset="50%" stop-color="#4D9DFF" />
      <stop offset="100%" stop-color="#1A66CC" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#28364E" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#FFB52E" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#4D9DFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#28364E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#28364E" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Background Grid Texture -->
  <rect width="1200" height="400" fill="url(#gridPattern)" />

  <!-- Ambient Glow Behind Elements -->
  <circle cx="430" cy="165" r="140" fill="url(#sunGlow)" />
  <circle cx="530" cy="165" r="140" fill="url(#moonGlow)" />

  <!-- Outer Frame -->
  <rect x="2" y="2" width="1196" height="396" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Celestial Symbols Group -->
  <g transform="translate(480, 115)">
    <!-- Equal (=) Pill Between Symbols -->
    <rect x="-24" y="-12" width="48" height="24" rx="12" fill="#1C2940" stroke="#FFB52E" stroke-width="1.5" stroke-opacity="0.7" />
    <text x="0" y="6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#FFB52E">=</text>

    <!-- SUN (Left) -->
    <g transform="translate(-100, 0)">
      <!-- Sun Rays -->
      <g stroke="url(#sunGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85">
        <line x1="0" y1="-44" x2="0" y2="-54" />
        <line x1="31" y1="-31" x2="38" y2="-38" />
        <line x1="44" y1="0" x2="54" y2="0" />
        <line x1="31" y1="31" x2="38" y2="38" />
        <line x1="0" y1="44" x2="0" y2="54" />
        <line x1="-31" y1="31" x2="-38" y2="38" />
        <line x1="-44" y1="0" x2="-54" y2="0" />
        <line x1="-31" y1="-31" x2="-38" y2="-38" />
      </g>
      <!-- Sun Core Orbit Ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#FFB52E" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3" />
      <!-- Sun Core -->
      <circle cx="0" cy="0" r="32" fill="url(#sunGrad)" />
      <!-- Sun Internal Highlight -->
      <circle cx="-8" cy="-8" r="12" fill="#FFFFFF" fill-opacity="0.3" />
    </g>

    <!-- MOON (Right) -->
    <g transform="translate(100, 0)">
      <!-- Orbit Ring -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#4D9DFF" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3" />
      <!-- Crescent Moon Path -->
      <path d="M 12 -32 A 32 32 0 1 0 32 12 A 26 26 0 1 1 12 -32 Z" fill="url(#moonGrad)" />
      <!-- Star Accent -->
      <circle cx="28" cy="-24" r="2.5" fill="#C2E0FF" opacity="0.8" />
      <circle cx="-28" cy="24" r="1.5" fill="#C2E0FF" opacity="0.6" />
    </g>
  </g>

  <!-- Typography -->
  <!-- Main Title: TANGO MASTER -->
  <text x="600" y="240" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="4">
    <tspan fill="#FFFFFF">TANGO</tspan>
    <tspan fill="#FFB52E"> MASTER</tspan>
  </text>

  <!-- Tagline: Think. Solve. Master. -->
  <text x="600" y="282" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="6" fill="#9AA8BD">
    THINK <tspan fill="#FFB52E">•</tspan> SOLVE <tspan fill="#4D9DFF">•</tspan> MASTER
  </text>

  <!-- Pill Metadata -->
  <g transform="translate(600, 328)">
    <rect x="-185" y="-14" width="370" height="28" rx="14" fill="#151D30" stroke="#28364E" stroke-width="1.2" />
    <text x="0" y="4" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#C2D4EA">
      SUN &amp; MOON LOGIC PUZZLE ENGINE
    </text>
  </g>
</svg>
